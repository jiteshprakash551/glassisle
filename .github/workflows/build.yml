name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Debug APK
        run: gradle --no-daemon assembleDebug
      - name: Signed release APK
        env:
          KS_B64: ${{ secrets.GLASSISLE_KS_B64 }}
          GLASSISLE_KS_PASS: ${{ secrets.GLASSISLE_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/gi.jks
            export GLASSISLE_KEYSTORE=$RUNNER_TEMP/gi.jks
            gradle --no-daemon assembleRelease
          else echo "no keystore secret; skipping release"; fi
      - name: Lint (informational)
        continue-on-error: true
        run: gradle --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
      - name: apksigner verify
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in app/build/outputs/apk/release/app-release.apk; do $AS verify --verbose --print-certs $f; done
